name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = from Conventional Commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Next version
    # The release commit itself must not trigger another release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: next
        run: node scripts/version.mjs next "${{ inputs.bump || 'auto' }}"
      - name: Ensure the tag is new
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.next.outputs.version }}" >/dev/null; then
            echo "Tag v${{ steps.next.outputs.version }} already exists" >&2
            exit 1
          fi
      - name: Release notes
        run: node scripts/version.mjs notes > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Installer (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Apply version
        run: node scripts/version.mjs set ${{ needs.version.outputs.version }}
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build installer
        working-directory: app
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles nsis
      - name: Collect installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $source = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $source.FullName "out/Snipe_${version}_${{ matrix.arch }}-setup.exe"
          Get-FileHash "out/*.exe" -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" | Out-File -Encoding ascii -Append "out/SHA256SUMS-${{ matrix.arch }}.txt"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commit version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/version.mjs set "$VERSION"
          if ! git diff --quiet; then
            git commit -am "chore(release): v$VERSION"
          fi
          git tag -a "v$VERSION" -m "Snipe v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt
          gh release create "v$VERSION" dist/* \
            --title "Snipe v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag
